trigger:
- main

resources:
  repositories:
    - repository: terraformstage
      type: git
      name: terraformstage

variables:
  workingDir: $(Build.SourcesDirectory)/terraformstage/staged
  tfPlanFile: tfplan

stages:

# =========================
# Stage 1 - Terraform Plan
# =========================
- stage: Plan
  displayName: "Terraform Plan Stage"
  jobs:
  - job: TerraformPlan
    pool:
      name: mypool

    steps:
    - checkout: terraformstage

    - script: terraform --version
      displayName: "Terraform Version"

    # Backend init (REMOTE STATE)
    - script: |
        cd $(workingDir)
        terraform init \
          -backend-config="myResourceGroup=$(TF_STATE_RG)" \
          -backend-config="mystorageacct15665542178=$(TF_STATE_SA)" \
          -backend-config="tfstate=$(TF_STATE_CONTAINER)" \
          -backend-config="terraform.tfstate=$(TF_STATE_KEY)"
      displayName: "Terraform Init (Remote Backend)"

    - script: |
        cd $(workingDir)
        terraform plan -out=$(tfPlanFile)
      displayName: "Terraform Plan"

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: "$(workingDir)/$(tfPlanFile)"
        ArtifactName: "terraformPlan"
        publishLocation: "Container"


# =========================
# Stage 2 - Terraform Apply
# =========================
- stage: Apply
  displayName: "Terraform Apply Stage"
  dependsOn: Plan
  condition: succeeded()

  jobs:
  - deployment: TerraformApply
    environment: "terraform-approval-env"
    pool:
      name: mypool

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: terraformstage

          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: "current"
              downloadType: "single"
              artifactName: "terraformPlan"
              downloadPath: "$(System.ArtifactsDirectory)"

          # IMPORTANT: Same backend config again
          - script: |
              cd $(workingDir)
              terraform init \
                -backend-config="myResourceGroup=$(TF_STATE_RG)" \
                -backend-config="mystorageacct15665542178=$(TF_STATE_SA)" \
                -backend-config="tfstate=$(TF_STATE_CONTAINER)" \
                -backend-config="terraform.tfstate=$(TF_STATE_KEY)"
            displayName: "Terraform Init (Remote Backend)"

          - script: |
              cd $(workingDir)
              terraform apply -auto-approve "$(System.ArtifactsDirectory)/terraformPlan/$(tfPlanFile)"
            displayName: "Terraform Apply"