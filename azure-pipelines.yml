trigger:
- none

variables:
  terraformVersion: '1.5.0'
  workingDirectory: '$(System.DefaultWorkingDirectory)/staged'

  # Backend config
  backendResourceGroup: 'myResourceGroup'
  backendStorageAccount: 'mystorageacct15665542178'
  backendContainerName: 'tfstate'
  backendKey: 'terraform.tfstate'

stages:

# -------------------------
# Stage 1: PLAN
# -------------------------
- stage: Plan
  displayName: "Terraform Plan"
  jobs:
  - job: PlanJob
    pool: mypool

    steps:
    - checkout: self

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: $(terraformVersion)

    - task: AzureCLI@2
      displayName: "Terraform Init & Plan"
      inputs:
        azureSubscription: 'devoptoazureconnection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          cd $(workingDirectory)

          terraform init \
            -backend-config="resource_group_name=$(backendResourceGroup)" \
            -backend-config="storage_account_name=$(backendStorageAccount)" \
            -backend-config="container_name=$(backendContainerName)" \
            -backend-config="key=$(backendKey)"

          terraform plan \
            -var-file="terraform.tfvars" \
            -out=tfplan

    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: '$(workingDirectory)/tfplan'
        artifactName: 'terraformPlan'
        publishLocation: 'Container'


# -------------------------
# Stage 2: APPLY (with approval)
# -------------------------
- stage: Apply
  displayName: "Terraform Apply"
  dependsOn: Plan
  condition: succeeded()

  jobs:
  - deployment: ApplyJob
    displayName: "Apply Terraform"
    environment: 'terraform-approval-env'

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)

          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: current
              downloadType: single
              artifactName: terraformPlan
              downloadPath: '$(System.DefaultWorkingDirectory)/staged'

          - task: AzureCLI@2
            displayName: "Terraform Apply"
            inputs:
              azureSubscription: 'devoptoazureconnection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                cd $(workingDirectory)

                terraform init \
                  -backend-config="resource_group_name=$(backendResourceGroup)" \
                  -backend-config="storage_account_name=$(backendStorageAccount)" \
                  -backend-config="container_name=$(backendContainerName)" \
                  -backend-config="key=$(backendKey)"

                terraform apply tfplan