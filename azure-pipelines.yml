trigger:
- none

variables:
  terraformVersion: '1.5.0'
  workingDirectory: '$(System.DefaultWorkingDirectory)/staged'

  backendResourceGroup: 'myResourceGroup'
  backendStorageAccount: 'mystorageacct15665542178'
  backendContainerName: 'tfstate'
  backendKey: 'terraform.tfstate'

stages:

# =====================================================
# STAGE 1: PLAN
# =====================================================
- stage: Plan
  displayName: Terraform Plan

  jobs:
  - job: PlanJob
    pool:
      name: mypool

    steps:
    - checkout: self

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: $(terraformVersion)

    - task: AzureCLI@2
      displayName: Terraform Init & Plan
      inputs:
        azureSubscription: devoptoazureconnection
        scriptType: ps
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        inlineScript: |
          cd $(workingDirectory)

          # Correct Service Principal authentication
          $env:ARM_CLIENT_ID=$env:servicePrincipalId
          $env:ARM_CLIENT_SECRET=$env:servicePrincipalKey
          $env:ARM_TENANT_ID=$env:tenantId
          $env:ARM_SUBSCRIPTION_ID=$env:AZURE_SUBSCRIPTION_ID

          terraform init `
            -backend-config="resource_group_name=$(backendResourceGroup)" `
            -backend-config="storage_account_name=$(backendStorageAccount)" `
            -backend-config="container_name=$(backendContainerName)" `
            -backend-config="key=$(backendKey)"

          terraform plan `
            -var-file="terraform.tfvars" `
            -out=tfplan

    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: '$(workingDirectory)/tfplan'
        artifactName: terraformPlan
        publishLocation: Container


# =====================================================
# STAGE 2: APPLY (APPROVAL REQUIRED)
# =====================================================
- stage: Apply
  displayName: Terraform Apply
  dependsOn: Plan
  condition: succeeded()

  jobs:
  - deployment: ApplyJob
    displayName: Apply Terraform
    environment: terraform-approval-env
    pool:
      name: mypool

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)

          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: current
              downloadType: single
              artifactName: terraformPlan
              downloadPath: '$(System.DefaultWorkingDirectory)/staged'

          - task: AzureCLI@2
            displayName: Terraform Apply
            inputs:
              azureSubscription: devoptoazureconnection
              scriptType: ps
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                cd $(workingDirectory)

                # Correct Service Principal authentication
                $env:ARM_CLIENT_ID=$env:servicePrincipalId
                $env:ARM_CLIENT_SECRET=$env:servicePrincipalKey
                $env:ARM_TENANT_ID=$env:tenantId
                $env:ARM_SUBSCRIPTION_ID=$env:AZURE_SUBSCRIPTION_ID

                terraform init `
                  -backend-config="resource_group_name=$(backendResourceGroup)" `
                  -backend-config="storage_account_name=$(backendStorageAccount)" `
                  -backend-config="container_name=$(backendContainerName)" `
                  -backend-config="key=$(backendKey)"

                terraform apply tfplan