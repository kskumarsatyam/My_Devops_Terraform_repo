trigger:
- none

resources:
  repositories:
    - repository: terraformstage
      type: git
      name: terraformstage

variables:
  workingDir: $(Build.SourcesDirectory)/terraformstage/staged
  tfPlanFile: tfplan

stages:

# =========================
# STAGE 1 - PLAN
# =========================
- stage: Plan
  displayName: "Terraform Plan"
  jobs:
  - job: PlanJob
    pool:
      name: mypool

    steps:
    - checkout: terraformstage

    # =========================
    # Install Terraform (FIXED)
    # =========================
    - powershell: |
        Write-Host "Fetching latest Terraform version..."

        $latest = (Invoke-RestMethod -Uri "https://checkpoint-api.hashicorp.com/v1/check/terraform").current_version
        Write-Host "Latest Terraform: $latest"

        $url = "https://releases.hashicorp.com/terraform/$latest/terraform_${latest}_windows_amd64.zip"
        $zip = "$(Agent.TempDirectory)\terraform.zip"
        $dir = "$(Agent.ToolsDirectory)\terraform"

        Invoke-WebRequest -Uri $url -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $dir -Force

        # 🔥 Persist Terraform for ALL steps in this job
        Write-Host "##vso[task.prependpath]$dir"

        terraform --version
      displayName: "Install Terraform (Latest)"

    # =========================
    # Terraform Init
    # =========================
    - script: |
        cd "$(workingDir)"
        terraform init
      displayName: "Terraform Init"

    - script: |
        cd "$(workingDir)"
        terraform plan -out=$(tfPlanFile)
      displayName: "Terraform Plan"

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: "$(workingDir)/$(tfPlanFile)"
        ArtifactName: "terraformPlan"


# =========================
# STAGE 2 - APPLY
# =========================
- stage: Apply
  displayName: "Terraform Apply"
  dependsOn: Plan
  condition: succeeded()

  jobs:
  - deployment: ApplyJob
    environment: "terraform-approval-env"
    pool:
      name: mypool

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: terraformstage

          # =========================
          # Install SAME Terraform version (safe consistency)
          # =========================
          - powershell: |
              $latest = (Invoke-RestMethod -Uri "https://checkpoint-api.hashicorp.com/v1/check/terraform").current_version

              $url = "https://releases.hashicorp.com/terraform/$latest/terraform_${latest}_windows_amd64.zip"
              $zip = "$(Agent.TempDirectory)\terraform.zip"
              $dir = "$(Agent.ToolsDirectory)\terraform"

              Invoke-WebRequest -Uri $url -OutFile $zip
              Expand-Archive -Path $zip -DestinationPath $dir -Force

              Write-Host "##vso[task.prependpath]$dir"

              terraform --version
            displayName: "Install Terraform (Latest)"

          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: "current"
              downloadType: "single"
              artifactName: "terraformPlan"
              downloadPath: "$(System.ArtifactsDirectory)"

          # =========================
          # Terraform Init (backend from backend.tf)
          # =========================
          - script: |
              cd "$(workingDir)"
              terraform init
            displayName: "Terraform Init"

          - script: |
              cd "$(workingDir)"
              terraform apply -auto-approve "$(System.ArtifactsDirectory)/terraformPlan/$(tfPlanFile)"
            displayName: "Terraform Apply"