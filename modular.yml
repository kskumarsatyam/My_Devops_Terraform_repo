# ... parameters stay the same ...

jobs:
- job: ModularDeploy
  displayName: 'Terraform Modular Deployment'
  pool: mypool
  steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'

  - task: AzureCLI@2
    displayName: 'Terraform Plan and Apply'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'ps'
      scriptLocation: 'inlineScript'
      workingDirectory: '$(System.DefaultWorkingDirectory)\modular_approach\root'
      inlineScript: |
        $ErrorActionPreference = "Stop"

        # 1. CLEANUP CACHE
        if (Test-Path ".terraform") {
            Write-Host "Cleaning up local terraform cache..."
            Remove-Item -Recurse -Force ".terraform"
        }

        # 2. INITIALIZE
        Write-Host "Initializing Terraform..."
        terraform init -reconfigure
        if ($LASTEXITCODE -ne 0) { throw "Terraform Init failed" }

        # 3. STATE SYNC: Handle 404 by checking if RG exists in Azure
        Write-Host "Checking if Resource Group exists in Azure..."
        $rgExists = az group exists --name "${{ parameters.resourceGroupName }}"
        
        # If RG is gone from Azure but in state, remove it from state so plan doesn't crash
        if ($rgExists -eq "false") {
            Write-Host "Resource Group not found in Azure. Cleaning state..."
            # Using -refresh=false in next steps or manually removing from state
            terraform state rm "azurerm_resource_group.rg" 2>$null
            terraform state rm "module.storage_account.azurerm_resource_group.rg" 2>$null
        }

        # 4. PLAN with no-refresh if needed
        Write-Host "Creating Deployment Plan..."
        terraform plan `
          -var="st_name=${{ parameters.storageName }}" `
          -var="rg_name=${{ parameters.resourceGroupName }}" `
          -var="location=${{ parameters.region }}" `
          -out=tfplan `
          -refresh=true # Set to false if Azure API is being slow to register deletions
        
        if ($LASTEXITCODE -ne 0) { throw "Terraform Plan failed" }

        # 5. APPLY
        Write-Host "Applying Changes..."
        terraform apply -auto-approve tfplan
