parameters:
- name: serviceConnection
  type: string
  default: 'Your-Actual-Connection-Name'
- name: storageName
  type: string
- name: resourceGroupName
  type: string
- name: region
  type: string
  default: 'East US'

trigger: none

jobs:
- job: ModularDeploy
  pool: mypool
  steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'

  - task: AzureCLI@2
    displayName: 'Terraform Plan and Apply'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'ps'
      scriptLocation: 'inlineScript'
      # 1. Update the folder name here to match your repo (ideally without spaces)
      workingDirectory: '$(System.DefaultWorkingDirectory)\modular_approach\root'
      inlineScript: |
        $ErrorActionPreference = "Stop"
        
        Write-Host "Current Location: $(Get-Location)"

        # 2. Total Cleanup of previous failed attempts
        if (Test-Path ".terraform") { 
            Write-Host "Removing existing .terraform folder..."
            Remove-Item -Recurse -Force ".terraform" 
        }
        if (Test-Path ".terraform.lock.hcl") { 
            Remove-Item -Force ".terraform.lock.hcl" 
        }

        # 3. Init with reconfigure
        Write-Host "Initializing..."
        terraform init -reconfigure
        if ($LASTEXITCODE -ne 0) { throw "Init failed" }

        # 4. Plan
        Write-Host "Planning..."
        terraform plan `
          -var="st_name=${{ parameters.storageName }}" `
          -var="rg_name=${{ parameters.resourceGroupName }}" `
          -var="location=${{ parameters.region }}" `
          -out=tfplan
        if ($LASTEXITCODE -ne 0) { throw "Plan failed" }

        # 5. Apply
        Write-Host "Applying..."
        terraform apply -auto-approve tfplan
