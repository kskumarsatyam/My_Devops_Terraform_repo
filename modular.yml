parameters:
- name: serviceConnection
  displayName: "Azure Service Connection"
  type: string
  default: 'Your-Actual-Connection-Name' # <--- MUST MATCH PROJECT SETTINGS

- name: storageName
  displayName: "Storage Account Name"
  type: string
  default: 'stmodularprod001'

- name: resourceGroupName
  displayName: "Resource Group Name"
  type: string
  default: 'rg-modular-prod'

- name: region
  displayName: "Location"
  type: string
  default: 'East US'

trigger: none

jobs:
- job: ModularDeploy
  displayName: 'Terraform Modular Deployment'
  pool: mypool # <--- Your Windows Agent Pool
  steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'

  - task: AzureCLI@2
    displayName: 'Terraform Plan and Apply'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'ps'
      scriptLocation: 'inlineScript'
      # Path uses underscores to avoid space-related errors on Windows
      workingDirectory: '$(System.DefaultWorkingDirectory)\modular_approach\root'
      inlineScript: |
        $ErrorActionPreference = "Stop"

        # 1. FORCE CLEANUP: This fixes the "Changes to backend configurations" error
        if (Test-Path ".terraform") {
            Write-Host "Cleaning up old terraform cache..."
            Remove-Item -Recurse -Force ".terraform"
        }

        # 2. INITIALIZE: Fresh start every time
        Write-Host "Initializing Terraform..."
        terraform init -reconfigure
        if ($LASTEXITCODE -ne 0) { throw "Terraform Init failed" }

        # 3. PLAN: Create the deployment plan
        Write-Host "Creating Deployment Plan..."
        terraform plan `
          -var="st_name=${{ parameters.storageName }}" `
          -var="rg_name=${{ parameters.resourceGroupName }}" `
          -var="location=${{ parameters.region }}" `
          -out=tfplan
        if ($LASTEXITCODE -ne 0) { throw "Terraform Plan failed" }

        # 4. APPLY: Execute the generated plan
        Write-Host "Applying Changes..."
        terraform apply -auto-approve tfplan
