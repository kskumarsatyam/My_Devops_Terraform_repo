# ... (parameters and trigger stay the same)

jobs:
- job: ModularDeploy
  pool: mypool
  steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'

  - task: AzureCLI@2
    displayName: 'Terraform Plan and Apply'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'ps'
      scriptLocation: 'inlineScript'
      # Keep workingDirectory at the root of the folder
      workingDirectory: '$(System.DefaultWorkingDirectory)\modular_approach\root'
      inlineScript: |
        $ErrorActionPreference = "Stop"

        # 1. CLEANUP: Delete the .terraform folder to force a fresh link of modules
        if (Test-Path ".terraform") { Remove-Item -Recurse -Force ".terraform" }

        # 2. RESOLVE PATHS: Show exactly where we are for debugging
        $currentDir = Get-Location
        Write-Host "Currently running in: $currentDir"
        
        # 3. INITIALIZE: Force Terraform to re-read the module source
        Write-Host "Initializing Terraform..."
        terraform init -reconfigure -input=false

        # 4. PLAN
        Write-Host "Creating Plan..."
        terraform plan `
          -var="st_name=${{ parameters.storageName }}" `
          -var="rg_name=${{ parameters.resourceGroupName }}" `
          -var="location=${{ parameters.region }}" `
          -out=tfplan

        # 5. APPLY
        Write-Host "Applying Plan..."
        terraform apply -auto-approve tfplan
