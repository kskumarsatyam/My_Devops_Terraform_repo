parameters:
- name: serviceConnection
  displayName: "Azure Service Connection"
  type: string
  default: 'Your-Actual-Connection-Name'

- name: storageName
  type: string
  default: 'stmodularprod01'

- name: resourceGroupName
  type: string
  default: 'rg-modular-prod'

- name: region
  type: string
  default: 'East US'

trigger: none

jobs:
- job: ModularDeploy
  pool: mypool
  steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'

  - task: AzureCLI@2
    displayName: 'Terraform Plan and Apply'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'ps'
      # THIS WAS MISSING:
      scriptLocation: 'inlineScript'
      # Path adjusted for your folder with spaces
      workingDirectory: '$(System.DefaultWorkingDirectory)\modular approach\root'
      inlineScript: |
        # 1. Initialize
        Write-Host "Initializing Terraform..."
        terraform init

        # 2. Plan
        Write-Host "Creating Deployment Plan..."
        terraform plan `
          -var="st_name=${{ parameters.storageName }}" `
          -var="rg_name=${{ parameters.resourceGroupName }}" `
          -var="location=${{ parameters.region }}" `
          -out=tfplan

        # 3. Apply
        Write-Host "Applying Changes..."
        terraform apply tfplan
