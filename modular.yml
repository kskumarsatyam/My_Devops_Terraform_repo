parameters:
- name: serviceConnection
  displayName: "Azure Service Connection"
  type: string
  default: 'Your-Actual-Connection-Name' # MUST BE VALID TO UNLOCK UI

- name: storageName
  type: string
  default: 'stmodularprod01'

- name: resourceGroupName
  type: string
  default: 'rg-modular-prod'

- name: region
  type: string
  default: 'East US'

trigger: none

jobs:
- job: ModularDeploy
  pool: mypool
  steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'

  - task: AzureCLI@2
    displayName: 'Terraform Apply'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'ps'
      # Handle the space in "modular approach" using quotes
      workingDirectory: '$(System.DefaultWorkingDirectory)\modular approach\staged2'
      inlineScript: |
        # Initialize
        terraform init

        # Apply using variables
        terraform apply `
          -var="st_name=${{ parameters.storageName }}" `
          -var="rg_name=${{ parameters.resourceGroupName }}" `
          -var="location=${{ parameters.region }}" `
          -auto-approve
