# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool: mypool

steps:

- checkout: self
- task: TerraformInstaller@1
  displayName: terrform install
  inputs:
    terraformVersion: 'latest'

- task: TerraformTask@5
  displayName: terraforminit
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(System.DefaultWorkingDirectory)/staged'
    backendServiceArm: 'devoptoazureconnection'

- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'plan'
    workingDirectory: '$(System.DefaultWorkingDirectory)/staged'
    environmentServiceNameAzureRM: 'devoptoazureconnection'



