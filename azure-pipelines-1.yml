trigger:
- none

pool:
  name: mypool

stages:

# =========================
# PLAN
# =========================
- stage: Plan
  jobs:
  - job: PlanJob
    steps:

    - checkout: self

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

    # 🔥 IMPORTANT FIX: Disable backend injection from task
    - task: TerraformTask@5
      displayName: "Terraform Init (FIXED)"
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/staged'
        backendType: 'azurerm'
        ensureBackend: false   # 🔥 CRITICAL FIX
        backendServiceArm: 'devoptoazureconnection'
        backendAzureRmResourceGroupName: 'myResourceGroup'
        backendAzureRmStorageAccountName: 'mystorageaccount123'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'terraform.tfstate'

    - task: TerraformTask@5
      displayName: "Terraform Plan"
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/staged'
        environmentServiceNameAzureRM: 'devoptoazureconnection'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/staged'
        ArtifactName: 'tfcode'


# =========================
# APPLY
# =========================
- stage: Apply
  dependsOn: Plan
  condition: succeeded()

  jobs:
  - deployment: ApplyJob
    environment: "terraform-approval-env"
    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: 'current'
              artifactName: 'tfcode'
              downloadPath: '$(System.DefaultWorkingDirectory)'

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTask@5
            displayName: "Terraform Init (FIXED)"
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/tfcode/staged'
              backendType: 'azurerm'
              ensureBackend: false
              backendServiceArm: 'devoptoazureconnection'
              backendAzureRmResourceGroupName: 'myResourceGroup'
              backendAzureRmStorageAccountName: 'mystorageaccount123'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'terraform.tfstate'

          - task: TerraformTask@5
            displayName: "Terraform Apply"
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/tfcode/staged'
              environmentServiceNameAzureRM: 'devoptoazureconnection'