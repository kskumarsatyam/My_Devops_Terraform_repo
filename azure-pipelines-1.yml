trigger:
- none

pool:
  name: mypool

stages:

# =========================
# PLAN
# =========================
- stage: Plan
  jobs:
  - job: PlanJob
    steps:

    - checkout: self

    # Azure Login + Terraform (FULL CONTROL)
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'devoptoazureconnection'
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |

          Write-Host "Azure Login Success"
          az account show

          # Install Terraform
          $latest = (Invoke-RestMethod https://checkpoint-api.hashicorp.com/v1/check/terraform).current_version
          $zip = "$(Agent.TempDirectory)\tf.zip"
          $dir = "$(Agent.ToolsDirectory)\terraform"

          Invoke-WebRequest "https://releases.hashicorp.com/terraform/$latest/terraform_${latest}_windows_amd64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force

          $env:PATH = "$dir;$env:PATH"

          terraform --version

          cd "$(System.DefaultWorkingDirectory)\staged"

          # 🔥 CLEAN INIT (NO AZURE DEVOPS TASK INTERFERENCE)
          terraform init `
            -backend-config="storage_account_name=mystorageacct15665542178" `
            -backend-config="container_name=tfstate" `
            -backend-config="key=terraform.tfstate" `
            -backend-config="resource_group_name=myResourceGroup"

          terraform plan -out=tfplan

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)\staged\tfplan'
        ArtifactName: tfplan


# =========================
# APPLY
# =========================
- stage: Apply
  dependsOn: Plan
  jobs:
  - deployment: ApplyJob
    environment: terraform-approval-env
    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: DownloadBuildArtifacts@0
            inputs:
              artifactName: tfplan
              downloadPath: '$(System.DefaultWorkingDirectory)'

          - task: AzureCLI@2
            inputs:
              azureSubscription: 'devoptoazureconnection'
              scriptType: ps
              scriptLocation: inlineScript
              inlineScript: |

                $latest = (Invoke-RestMethod https://checkpoint-api.hashicorp.com/v1/check/terraform).current_version
                $zip = "$(Agent.TempDirectory)\tf.zip"
                $dir = "$(Agent.ToolsDirectory)\terraform"

                Invoke-WebRequest "https://releases.hashicorp.com/terraform/$latest/terraform_${latest}_windows_amd64.zip" -OutFile $zip
                Expand-Archive $zip -DestinationPath $dir -Force

                $env:PATH = "$dir;$env:PATH"

                cd "$(System.DefaultWorkingDirectory)\staged"

                terraform init `
                  -backend-config="storage_account_name=mystorageacct15665542178" `
                  -backend-config="container_name=tfstate" `
                  -backend-config="key=terraform.tfstate" `
                  -backend-config="resource_group_name=myResourceGroup"

                terraform apply -auto-approve tfplan