trigger:
- none

pool:
  name: mypool

stages:

# =========================
# STAGE 1 - PLAN
# =========================
- stage: Plan
  displayName: "Terraform Plan"
  jobs:
  - job: PlanJob
    steps:

    - checkout: self

    # Install Terraform
    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: 'latest'

    # INIT (FIXED - NO azuread_auth)
    - task: TerraformTask@5
      displayName: "Terraform Init"
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/staged'
        backendServiceArm: 'devoptoazureconnection'
        backendAzureRmResourceGroupName: 'myResourceGroup'
        backendAzureRmStorageAccountName: 'mystorageaccount123'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'terraform.tfstate'

    # PLAN
    - task: TerraformTask@5
      displayName: "Terraform Plan"
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/staged'
        environmentServiceNameAzureRM: 'devoptoazureconnection'

    # Publish plan
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/staged'
        ArtifactName: 'tfcode'


# =========================
# STAGE 2 - APPLY
# =========================
- stage: Apply
  displayName: "Terraform Apply"
  dependsOn: Plan
  condition: succeeded()

  jobs:
  - deployment: ApplyJob
    environment: "terraform-approval-env"
    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          # Download artifact
          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'tfcode'
              downloadPath: '$(System.DefaultWorkingDirectory)'

          # Install Terraform
          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: 'latest'

          # INIT (same backend, NO azuread_auth)
          - task: TerraformTask@5
            displayName: "Terraform Init"
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/tfcode/staged'
              backendServiceArm: 'devoptoazureconnection'
              backendAzureRmResourceGroupName: 'myResourceGroup'
              backendAzureRmStorageAccountName: 'mystorageaccount123'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'terraform.tfstate'

          # APPLY
          - task: TerraformTask@5
            displayName: "Terraform Apply"
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/tfcode/staged'
              environmentServiceNameAzureRM: 'devoptoazureconnection'