parameters:
- name: serviceConnection
  type: string
  default: 'Your-Actual-Connection-Name'
- name: storageName
  type: string
- name: resourceGroupName
  type: string
- name: region
  type: string
  default: 'East US'

trigger: none

jobs:
- job: ModularDeploy
  pool: mypool
  steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'

  - task: AzureCLI@2
    displayName: 'Terraform Plan and Apply'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'ps'
      scriptLocation: 'inlineScript'
      # Ensure this path matches your repo exactly
      workingDirectory: '$(System.DefaultWorkingDirectory)\modular approach\root'
      inlineScript: |
        # 1. Force re-initialization to ignore backend mismatches
        Write-Host "Initializing Terraform..."
        terraform init -reconfigure
        if ($LASTEXITCODE -ne 0) { throw "Terraform Init failed" }

        # 2. Generate the plan
        Write-Host "Creating Deployment Plan..."
        terraform plan `
          -var="st_name=${{ parameters.storageName }}" `
          -var="rg_name=${{ parameters.resourceGroupName }}" `
          -var="location=${{ parameters.region }}" `
          -out=tfplan
        if ($LASTEXITCODE -ne 0) { throw "Terraform Plan failed" }

        # 3. Apply the specific plan file
        Write-Host "Applying Changes..."
        terraform apply -auto-approve tfplan
