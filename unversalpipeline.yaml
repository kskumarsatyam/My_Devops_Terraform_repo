parameters:
- name: serviceConnection
  displayName: "Azure Service Connection"
  type: string
  default: 'My-Azure-Connection'



- name: storageName
  displayName: "New Storage Account Name"
  type: string

- name: resourceGroupName
  displayName: "Target Resource Group"
  type: string

- name: region
  displayName: "Location"
  type: string
  default: 'East US'

trigger: none

jobs:
- job: DeployFromFolder
  displayName: 'Terraform via Azure CLI'
  pool: mypool
  
  steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'

  # The Azure CLI task now points to your specific folder
    - task: AzureCLI@2
    displayName: 'Terraform Init and Apply'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'ps'
      scriptLocation: 'inlineScript'
      # Correct syntax for Windows Agent:
      workingDirectory: '$(System.DefaultWorkingDirectory)\staged2'
      inlineScript: |
        terraform init
        terraform apply `
          -var="st_name=${{ parameters.storageName }}" `
          -var="rg_name=${{ parameters.resourceGroupName }}" `
          -var="location=${{ parameters.region }}" `
          -auto-approve

