parameters:
- name: serviceConnection
  displayName: "Azure Service Connection"
  type: string
  default: 'My-Azure-Connection'

- name: terraformFolder
  displayName: "Folder Path in Repo"
  type: string
  default: '$(System.DefaultWorkingDirectory)\staged1' # Change this to match your folder name

- name: storageName
  displayName: "New Storage Account Name"
  type: string

- name: resourceGroupName
  displayName: "Target Resource Group"
  type: string

- name: region
  displayName: "Location"
  type: string
  default: 'East US'

trigger: none

jobs:
- job: DeployFromFolder
  displayName: 'Terraform via Azure CLI'
  pool: mypool
   
  
  steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'

  # The Azure CLI task now points to your specific folder
  - task: AzureCLI@2
    displayName: 'Terraform Init and Apply'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'pscore'
      scriptLocation: 'inlineScript'
      # CRITICAL: This tells the agent to run inside your folder
      workingDirectory: $(terraformWorkingDir)
      inlineScript: |
        # Initialize (Reads backend.tf inside the folder)
        terraform init

        # Apply using variables from the pipeline
        terraform apply `
          -var="st_name=${{ parameters.storageName }}" `
          -var="rg_name=${{ parameters.resourceGroupName }}" `
          -var="location=${{ parameters.region }}" `
          -auto-approve
