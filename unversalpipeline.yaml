parameters:
- name: serviceConnection
  type: string
  default: 'Your-Actual-Connection-Name'
- name: storageName
  type: string
- name: resourceGroupName
  type: string
- name: region
  type: string
  default: 'East US'

trigger: none

jobs:
- job: ModularDeploy
  pool: mypool
  steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'

  - task: AzureCLI@2
    displayName: 'Terraform Plan and Apply'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'ps'
      scriptLocation: 'inlineScript'
      workingDirectory: '$(System.DefaultWorkingDirectory)\modular approach\root'
      inlineScript: |
        # 1. Force PowerShell to stop on ANY error
        $ErrorActionPreference = "Stop"

        # 2. Cleanup old "stuck" folder (This fixes the backend error for good)
        if (Test-Path ".terraform") {
            Write-Host "Cleaning up old terraform cache..."
            Remove-Item -Recurse -Force ".terraform"
        }

        # 3. Initialize (Fresh start)
        Write-Host "Initializing Terraform..."
        terraform init -reconfigure
        if ($LASTEXITCODE -ne 0) { exit 1 }

        # 4. Generate the plan
        Write-Host "Creating Deployment Plan..."
        terraform plan `
          -var="st_name=${{ parameters.storageName }}" `
          -var="rg_name=${{ parameters.resourceGroupName }}" `
          -var="location=${{ parameters.region }}" `
          -out=tfplan
        if ($LASTEXITCODE -ne 0) { exit 1 }

        # 5. Apply the plan
        Write-Host "Applying Changes..."
        terraform apply -auto-approve tfplan
